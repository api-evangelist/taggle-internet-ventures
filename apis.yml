  to purchase discounted products and services from merchants across food & beverage, wellness, and
  beauty. It raised an early venture round in 2010 and is now reported as permanently closed. The
  enrichment pass found no live developer program, public API, OpenAPI/AsyncAPI specification, SDKs,
